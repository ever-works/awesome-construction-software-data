markdown: >-
  ## Overview


  Jobber is field service scheduling software and app designed to help service
  businesses organize their operations. It is used by construction and trade
  contractors to manage quoting, scheduling, invoicing, and customer payments in
  a single platform.


  ## Features


  - Quote creation and management

  - Job scheduling and dispatching

  - Invoicing and payment collection

  - Mobile app for field teams

  - Customer relationship management

  - Customer support tools


  ## Pricing


  Paid subscription with monthly pricing tiers based on features and number of
  users.


  ## Deployment


  Cloud-based (SaaS) with mobile apps for iOS and Android.

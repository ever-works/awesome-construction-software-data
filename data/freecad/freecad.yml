markdown: >-
  ## Overview


  FreeCAD is a free and open-source multiplatform 3D parametric modeler. It is
  designed primarily for mechanical engineering and product design but extends
  to architectural and BIM workflows through its modular workbench system.


  ## Features


  - Parametric modeling with history-based design

  - Modular architecture with workbenches for different domains

  - Python scripting API for automation and extension

  - Cross-platform: Windows, macOS, Linux

  - BIM workbench for architectural modeling and IFC support

  - Mesh, FEM, and drafting workbenches


  ## Pricing


  Free and open-source under the GNU LGPL license. Source code available at
  https://github.com/FreeCAD/FreeCAD


  ## Deployment


  Desktop application (self-hosted, locally installed).

company_name: Awesome Construction Software
content_table: true
item_name: Item
items_name: Items
paging_mode: paging
copyright_year: 2026
name: Awesome Construction Software
initial_prompt: >-
  A curated directory of construction-management, estimating, takeoff and BIM
  software. Include products such as Procore, Autodesk Construction Cloud,
  Buildertrend, Fieldwire, Trimble Viewpoint, Raken, STACK, Bluebeam, Sage 300
  CRE, Bonsai (BlenderBIM), IfcOpenShell, xBIM, plus other notable commercial
  and open-source options. Categories: Construction Management, Estimating &
  Takeoff, BIM & Design Coordination, Field & Site Apps, Construction
  Accounting, Open-Source BIM. For every item capture the official website, a
  short factual description, pricing model (free, freemium, paid, open source),
  deployment (cloud or self-hosted), key features and integrations.


  Initial categories: Construction Management; Estimating & Takeoff; BIM &
  Design Coordination; Field & Site Apps; Construction Accounting; Open-Source
  BIM.

  Target keywords: construction management software, construction project
  management, bim software, takeoff software.


  Start with these source lists (use the raw README link for GitHub lists):

  - https://www.softwaresuggest.com/construction-management-software

  - https://www.softwaresuggest.com/bim-software

  - https://www.saashub.com/best-construction-management-software

  - https://raw.githubusercontent.com/mitevpi/awesome-bim/HEAD/README.md

  - https://en.wikipedia.org/wiki/Category:Building_information_modeling

  - https://github.com/topics/construction

  - https://github.com/topics/bim


  Inclusion rules: every item is a real product, service, open-source project or
  platform in scope; never a statistic, quote, blog post, person or general
  concept.

  One item per product. The item URL is the official website (never an affiliate
  link, review-site page or "top 10" article). Skip discontinued products and
  sites that no longer resolve.

  Descriptions: 2-4 factual sentences, no hype; state the pricing model; for
  open source state the license and link the repository.

  Each item gets exactly one primary category from the initial categories; do
  not create near-duplicate categories.

  Tags where they apply: Open Source, Self-Hosted, Free Plan, Freemium, Paid,
  Enterprise, API, AI-Powered, plus niche-specific ones.

  Never use G2, Capterra, GetApp, TrustRadius, AlternativeTo, Product Hunt,
  SourceForge/Slashdot, There's An AI For That or Toolify as sources.
website_repo: ever-works/awesome-construction-software-website
company_website: https://construction.ever.works

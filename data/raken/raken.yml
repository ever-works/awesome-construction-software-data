markdown: >-
  ## Overview


  Raken is a field management and daily reporting app for construction teams,
  enabling project documentation, time tracking, photo capture, and
  communication from the job site through mobile and web platforms.


  ## Features


  - Daily field reports and daily logs

  - Time tracking and crew management

  - Photo and video documentation

  - Toolbox talks and safety meetings

  - RFIs and issue tracking

  - Integration with Procore, Autodesk Construction Cloud, and other
  construction platforms

  - Offline capability for field use


  ## Pricing


  Paid subscription software with tiered plans based on project volume and
  users.

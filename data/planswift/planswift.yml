markdown: >-
  ## Overview


  PlanSwift is takeoff software that enables contractors to create accurate
  project estimates specific to their individual trade. It provides
  comprehensive takeoff tools with customization options for construction
  estimating workflows.


  ## Features


  - Digital takeoff tools

  - Trade-specific estimating

  - Customizable templates and tools

  - Integration capabilities with other construction software

  - User-friendly interface

  - Measurement and quantity extraction


  ## Pricing


  Paid with perpetual license or subscription options.


  ## Deployment


  Desktop software with optional cloud features.

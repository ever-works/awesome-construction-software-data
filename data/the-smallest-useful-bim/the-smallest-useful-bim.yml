markdown: >-
  ## Overview


  The Smallest Useful BIM is a minimal Building Information Modeling
  implementation, described as the smallest useful BIM. It is a C# library for
  lightweight BIM data handling in construction and AEC applications.


  ## Features


  - Minimal BIM implementation

  - C# library

  - Lightweight BIM data handling

  - AEC focused


  ## Pricing


  Free and open-source.


  ## Deployment


  C# library, self-hosted.

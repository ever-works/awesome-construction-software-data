markdown: >-
  ## Overview


  Open, self-hosted, IFC-native AEC platform combining web BIM viewer and
  modeling with a ~100-module GC portal covering RFIs, pay applications, CPM
  scheduling, construction accounting (double-entry GL/WIP → QuickBooks),
  e-signatures, AI assist, IDS authoring, estimating with embodied carbon,
  development proforma, and operate/dispose capabilities (CMMS, facility
  condition, rent roll, waterfall).


  ## Features


  - Web BIM viewer + modeling

  - IFC-native

  - Self-hosted

  - ~100-module GC portal

  - RFIs, pay apps, CPM scheduling

  - Construction accounting: double-entry GL/WIP → QuickBooks

  - E-signatures

  - AI assist

  - IDS authoring

  - Estimating + embodied carbon

  - Development proforma

  - CMMS, facility condition, rent roll, waterfall

  - Python


  ## Pricing


  Free and open-source.


  ## Deployment


  Self-hosted, Python.

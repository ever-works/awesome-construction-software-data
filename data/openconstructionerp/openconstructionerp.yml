markdown: >-
  ## Overview


  OpenConstructionERP is an open-source construction ERP system covering BOQ,
  PDF/CAD/BIM takeoff, and AI cost matching. It includes 293 guided cases,
  120,000+ priced positions, support for 44 languages, 190+ modules, and cost
  data for 40+ markets.


  ## Features


  - BOQ (Bill of Quantities) management

  - PDF/CAD/BIM takeoff

  - AI cost matching

  - 293 guided cases

  - 120,000+ priced positions

  - 44 languages

  - 190+ modules

  - Cost data for 40+ markets

  - pip installable


  ## Pricing


  Free and open-source under AGPL-3.0 license.


  ## Deployment


  Self-hosted, Python package installable via pip.

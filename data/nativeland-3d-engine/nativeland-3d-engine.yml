markdown: >-
  ## Overview


  A free and open-source 3D engine based on Vue3 + THREE.JS with its
  accompanying editor. It features functions such as BIM lightweighting, CAD
  parsing preview, particle system, and plugin system.


  ## Features


  - BIM lightweighting

  - CAD parsing preview

  - Particle system

  - Plugin system

  - Vue3 + THREE.JS based

  - Accompanying editor


  ## Pricing


  Free and open-source. Repository: https://github.com/nativeland/nativeland


  ## Deployment


  Web-based.

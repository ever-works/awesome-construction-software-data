markdown: >-
  ## Overview


  Autodesk BIM 360 is construction project management software that provides
  cloud-based collaboration, document management, and issue tracking for
  architecture, engineering, and construction teams. It is part of the Autodesk
  Construction Cloud ecosystem.


  ## Features


  - Cloud-based document management

  - Team collaboration tools

  - Issue tracking and resolution

  - Model coordination

  - Field management

  - Project analytics


  ## Pricing


  Paid enterprise subscription with tiered pricing based on users and features.


  ## Deployment


  Cloud-based (SaaS).

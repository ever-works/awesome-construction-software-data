markdown: >-
  ## Overview


  Open-source (AGPL-3.0) PDF takeoff engine for construction and flooring,
  designed to be driven natively by AI agents over MCP (Model Context Protocol).
  Measures rooms on wall faces, performs symbol sweeps, and calculates materials
  and quantities with full provenance. Runs entirely in the browser.


  ## Features


  - PDF takeoff for construction & flooring

  - AGPL-3.0 open source

  - AI agent-native via MCP

  - Room measurement on wall faces

  - Symbol sweeps

  - Materials + quantities calculation

  - Full provenance

  - Preconstruction focused

  - Browser-based (runs entirely in browser)


  ## Pricing


  Free and open-source under AGPL-3.0 license.


  ## Deployment


  Browser-based, client-side.

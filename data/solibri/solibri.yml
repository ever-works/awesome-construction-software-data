markdown: >-
  ## Overview


  Solibri is a BIM quality assurance and model checking software for architects,
  engineers, and contractors, enabling automated design validation, clash
  detection, and model coordination across building projects.


  ## Features


  - Automated model checking and code compliance

  - Clash detection and collision analysis

  - Model quality assurance and validation

  - Rule-based checking with customizable rulesets

  - BCF issue reporting

  - IFC support for interoperability

  - Reporting and documentation


  ## Pricing


  Paid commercial software with subscription licensing available through
  Solibri.

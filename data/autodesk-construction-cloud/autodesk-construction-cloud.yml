markdown: >-
  ## Overview


  Autodesk Construction Cloud is a connected construction platform that unifies
  design, planning, project management, and field operations through cloud-based
  BIM and construction management tools.


  ## Features


  - Document management and control

  - Project cost and field management

  - Design collaboration and BIM coordination

  - Quality and safety management

  - Bid management and trade partner collaboration

  - Analytics and predictive insights

  - Integration with Autodesk Revit, Navisworks, and AutoCAD


  ## Pricing


  Paid enterprise software with tiered pricing based on project volume and user
  count.
